name: Daily sport reminder

on:
  schedule:
    # Staggered to :25 (vs meditation's :05) + a 0–12 min random jitter in the
    # script, so the two apps never buzz at the same minute. 18:25 UTC ≈ 20:25 CEST.
    - cron: '25 6,18 * * *'
  workflow_dispatch: {} # allows manual "Run workflow" for testing

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install firebase-admin
        run: npm install firebase-admin@^12
      - name: Send reminders
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: node scripts/send-reminders.mjs
